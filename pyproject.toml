[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-agent"
version = "0.1.0"
description = "Local civic voting assistant and calendar generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.196.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
