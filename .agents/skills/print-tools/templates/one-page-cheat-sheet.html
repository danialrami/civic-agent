<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  @page {
    size: letter portrait;
    margin: 0.5in;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #111;
    margin: 0;
    padding: 0;
    font-size: 10.5pt;
    line-height: 1.3;
  }
  h1 {
    font-size: 15pt;
    margin: 0 0 4px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #000;
    padding-bottom: 4px;
  }
  .meta {
    font-size: 8.5pt;
    color: #444;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 8px;
  }
  th, td {
    padding: 4px 6px;
    text-align: left;
    border-bottom: 1px solid #ddd;
    font-size: 9pt;
  }
  th {
    background-color: #f0f0f0;
    font-weight: 600;
    border-bottom: 2px solid #333;
    font-size: 8.5pt;
    text-transform: uppercase;
  }
  .section-row td {
    background-color: #eaeaea;
    font-weight: bold;
    font-size: 8.5pt;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 3px 6px;
    border-top: 1px solid #aaa;
    border-bottom: 1px solid #aaa;
  }
  .choice {
    font-weight: bold;
    color: #000;
  }
  .box {
    display: inline-block;
    width: 11px;
    height: 11px;
    border: 1.5px solid #000;
    margin-right: 4px;
    vertical-align: middle;
    text-align: center;
    line-height: 10px;
    font-size: 8pt;
    font-weight: bold;
  }
  .footer {
    margin-top: 6px;
    font-size: 7.5pt;
    color: #666;
    border-top: 1px dashed #999;
    padding-top: 4px;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>{{TITLE}}</h1>
  <div class="meta">
    <div><strong>Date:</strong> {{DATE}} &bull; <strong>Hours:</strong> {{HOURS}}</div>
    <div><strong>Location:</strong> {{LOCATION}} &bull; <strong>Precinct:</strong> {{PRECINCT}}</div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 32%;">Contest / Measure</th>
        <th style="width: 40%;">Candidates / Options</th>
        <th style="width: 28%;">My Selection</th>
      </tr>
    </thead>
    <tbody>
      {{TABLE_ROWS}}
    </tbody>
  </table>

  <div class="footer">
    <em>{{FOOTER_TEXT}}</em>
  </div>
</body>
</html>
